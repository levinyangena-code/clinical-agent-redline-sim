[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-agent-redline-sim"
version = "0.1.0"
description = "Defensive, sandboxed simulation of indirect prompt injection and RAG poisoning in a clinical agent workflow (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
clinical-redline = "clinical_redline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
